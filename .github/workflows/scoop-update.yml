name: Update Scoop Bucket

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-scoop:
    name: Open PR to t4ko0522/tap
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve release metadata
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          asset="ccwin-notify-${TAG}-windows-amd64.zip"
          asset_url="https://github.com/${REPO}/releases/download/${TAG}/${asset}"
          sha256_url="${asset_url}.sha256"

          tmpdir="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 \
            --output "${tmpdir}/asset.sha256" "${sha256_url}"
          sha256="$(awk '{print tolower($1)}' "${tmpdir}/asset.sha256")"

          if [[ ! "${sha256}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::sha256 sidecar が想定形式ではありません: ${sha256}"
            exit 1
          fi

          {
            echo "version=${version}"
            echo "tag=${TAG}"
            echo "asset=${asset}"
            echo "asset_url=${asset_url}"
            echo "sha256=${sha256}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: t4ko0522/tap
          token: ${{ secrets.SCOOP_TAP_TOKEN }}
          path: tap

      - name: Write manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET_URL: ${{ steps.meta.outputs.asset_url }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p tap/bucket
          cat > tap/bucket/ccwin-notify.json <<JSON
          {
            "version": "${VERSION}",
            "description": "Windows toast / sound / webhook notifier for Claude Code Hooks.",
            "homepage": "https://github.com/t4ko0522/ccwin-notify",
            "license": "Unknown",
            "architecture": {
              "64bit": {
                "url": "${ASSET_URL}",
                "hash": "${SHA256}",
                "bin": "ccwin-notify.exe"
              }
            },
            "post_install": [
              "Write-Host ''",
              "Write-Host 'ccwin-notify がインストールされました。' -ForegroundColor Green",
              "Write-Host '通知音・Webhook URL などを設定するには次を実行してください:' -ForegroundColor Cyan",
              "Write-Host '    ccwin-notify init' -ForegroundColor Yellow",
              "Write-Host ''"
            ],
            "checkver": {
              "github": "https://github.com/t4ko0522/ccwin-notify"
            },
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/t4ko0522/ccwin-notify/releases/download/v\$version/ccwin-notify-v\$version-windows-amd64.zip",
                  "hash": {
                    "url": "\$url.sha256",
                    "regex": "^([A-Fa-f0-9]+)"
                  }
                }
              }
            }
          }
          JSON

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          path: tap
          token: ${{ secrets.SCOOP_TAP_TOKEN }}
          commit-message: "ccwin-notify: bump to ${{ steps.meta.outputs.version }}"
          branch: update/ccwin-notify-${{ steps.meta.outputs.version }}
          delete-branch: true
          title: "ccwin-notify: bump to ${{ steps.meta.outputs.version }}"
          body: |
            ccwin-notify ${{ steps.meta.outputs.tag }} の自動更新 PR です。

            - asset: ${{ steps.meta.outputs.asset_url }}
            - sha256: `${{ steps.meta.outputs.sha256 }}`

            このPRは [release event](${{ github.event.release.html_url }}) によって自動生成されました。
