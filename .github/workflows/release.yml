name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish GitHub Release
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      asset: ${{ steps.vars.outputs.asset }}
      asset_url: ${{ steps.vars.outputs.asset_url }}
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: vars
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $asset = "ccwin-$tag-windows-amd64.zip"
          $assetUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$asset"
          "tag=$tag"             | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "asset=$asset"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "asset_url=$assetUrl"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: go build
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -v -trimpath `
            -ldflags "-s -w -X main.version=${{ steps.vars.outputs.version }}" `
            -o dist/ccwin.exe ./cmd/ccwin-notify

      - name: Stage release files
        shell: pwsh
        run: |
          Copy-Item README.md     dist/README.md
          Copy-Item SECURITY.md   dist/SECURITY.md
          Copy-Item ARCHITECTURE.md dist/ARCHITECTURE.md

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath ${{ steps.vars.outputs.asset }} -Force

      - name: Compute SHA256
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash -Algorithm SHA256 ${{ steps.vars.outputs.asset }}).Hash.ToLower()
          "sha256=$h" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "$h  ${{ steps.vars.outputs.asset }}" | Out-File -FilePath "${{ steps.vars.outputs.asset }}.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.vars.outputs.asset }}
            ${{ steps.vars.outputs.asset }}.sha256

      - name: Summary
        shell: pwsh
        run: |
          "asset=${{ steps.vars.outputs.asset }}"   | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "sha256=${{ steps.hash.outputs.sha256 }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  update-scoop:
    name: Push manifest to t4ko0522/tap
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
      ASSET_URL: ${{ needs.release.outputs.asset_url }}
      SHA256: ${{ needs.release.outputs.sha256 }}
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: t4ko0522/tap
          token: ${{ secrets.SCOOP_TAP_TOKEN }}

      - name: Write manifest
        run: |
          set -euo pipefail
          mkdir -p bucket
          cat > bucket/ccwin.json <<JSON
          {
              "version": "${VERSION}",
              "description": "Windows toast / sound / webhook notifier for Claude Code Hooks.",
              "homepage": "https://github.com/t4ko0522/ccwin-notify",
              "license": "Unknown",
              "architecture": {
                  "64bit": {
                      "url": "${ASSET_URL}",
                      "hash": "${SHA256}",
                      "bin": "ccwin.exe"
                  }
              },
              "post_install": [
                  "Write-Host ''",
                  "Write-Host 'ccwin がインストールされました。' -ForegroundColor Green",
                  "Write-Host '通知音・Webhook URL などを設定するには次を実行してください:' -ForegroundColor Cyan",
                  "Write-Host '    ccwin init' -ForegroundColor Yellow",
                  "Write-Host ''"
              ],
              "checkver": "github",
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/t4ko0522/ccwin-notify/releases/download/v\$version/ccwin-v\$version-windows-amd64.zip"
                      }
                  }
              }
          }
          JSON

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/ccwin.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ccwin: ${TAG}"
          git push
